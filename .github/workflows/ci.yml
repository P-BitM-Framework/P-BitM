name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ADMIN_USERNAME: test-admin
      ADMIN_PASSWORD: A-secure-test-password-123
      ADMIN_EMAIL: admin@bitm.local
      INTERNAL_API_KEY: test-internal-key-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
      DATA_ENCRYPTION_KEY: test-encryption-key-xxxxxxxxxxxxxxxxxxxxxxxxxxxxx
      CAMPAIGN_ID: test-campaign
      CAMPAIGN_PROTOCOL: selkies
      GATEWAY_AUTH_KEY: test-gateway-key
      SESSION_TOKEN_SECRET: test-session-secret
    steps:
      - uses: actions/checkout@v7
      - name: Configure test storage
        shell: bash
        run: |
          echo "STORAGE_PATH=${RUNNER_TEMP}/pbitm-storage" >> "$GITHUB_ENV"
          echo "HOST_STORAGE_PATH=${RUNNER_TEMP}/pbitm-storage" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            server/backend/requirements.txt
            server/backend-phishing/app/requirements.txt
      - run: >-
          python -m pip install pytest
          -r requirements.txt
          -r server/backend/requirements.txt
          -r server/backend-phishing/app/requirements.txt
      - run: python -m pytest tests
      - run: PYTHONPATH=server/backend python -m pytest server/backend/tests
      - run: >-
          PYTHONPATH=server/backend-phishing/app
          python -m pytest server/backend-phishing/tests

  repository:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: python3 scripts/release_checks.py
      - name: Validate Compose configuration
        run: |
          cp server/.env.example server/.env
          : > server/.traefik-dns.env
          docker compose -f server/docker-compose.yml config --quiet
          docker compose -f server/docker-compose-dev.yml config --quiet
